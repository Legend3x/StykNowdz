# Build the StykNowdz Windows app (Setup installer and Portable exe) on GitHub.
# - Actions tab → Build Windows app → Run workflow: builds it and, with
#   "Publish a GitHub Release" ticked (the default), publishes release
#   v<package.json version> with both exe files and that version's notes from
#   CHANGELOG.md (release-notes.md). Untick it to only build: download
#   "StykNowdz-windows" from the run's Artifacts.
# - Pushing a version tag (v1.6.2) does the same build and release.
# Publishing again for the same version replaces its exe files and notes.
# The exe files are not code-signed, so Windows SmartScreen warns on first run.
# (desktop-release.yml is StykAnimate's own signed release workflow; StykNowdz
# doesn't have its signing keys and doesn't use it.)
name: Build Windows app
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for this version
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  windows:
    name: Package StykNowdz for Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
      # Blender's engine for 3D Nowdz's Blender tools: Python 3.13 + bpy, shipped in Setup.
      # (Set up before 3.12.9, which the rest of the build uses, so 3.12.9 stays the default.)
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: '3.13'
      - name: Restore the Blender engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: build/blender-engine
          key: blender-engine-win-bpy5.3.0-${{ steps.py313.outputs.python-version }}-${{ hashFiles('scripts/build-blender-engine.mjs') }}
      - name: Build the Blender engine (Python 3.13 + bpy 5.3.0)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          PYTHON: ${{ steps.py313.outputs.python-path }}
        run: node scripts/build-blender-engine.mjs --bpy 5.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-build.txt
      - name: Build the native scanner, codec and video encoder
        run: |
          npm run build:frame-scan
          npm run build:vfw
          npm run build:sidecar
          npm run verify:sidecar
          npm run build:video-encoder
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
      - name: Package Setup and Portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          npm run release:prepare
          # Setup carries Blender's engine; Portable unpacks itself on every start, so it
          # leaves the engine out and uses the person's own Blender for Blender tools.
          npx electron-builder --win nsis --x64 --publish never "--config.directories.output=release/$version"
          node -e "const b=require('./package.json').build; b.win.extraResources=b.win.extraResources.filter(r=>r.to!=='blender-engine'); require('fs').writeFileSync('build/portable-builder.json', JSON.stringify(b))"
          npx electron-builder --win portable --x64 --publish never --config build/portable-builder.json "--config.directories.output=release/$version-portable"
          mv release/$version-portable/*.exe "release/$version/"
          ls -la "release/$version"
          cat build/blender-engine/build-info.json
      - name: Blender tools work in the packaged app
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          STYK_ENGINE_ROOT="release/$version/win-unpacked/resources/blender-engine" node scripts/blender-engine-check.mjs "$RUNNER_TEMP/engine.json"
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: StykNowdz-windows
          path: release/*/*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          tag="v${version}" title="StykNowdz ${version}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" release/${version}/*.exe --clobber
            gh release edit "${tag}" --title "${title}" --notes-file release-notes.md
          else
            gh release create "${tag}" release/${version}/*.exe --target "${GITHUB_SHA}" --title "${title}" --notes-file release-notes.md --latest
          fi
          echo "Published ${title}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
