# Build the StykNowdz Windows app (Setup installer and Portable exe) on GitHub.
# - Pushing a version tag (v1.6.2) builds it and publishes a GitHub Release with
#   both exe files and that version's notes from CHANGELOG.md (release-notes.md).
# - Running it from the Actions tab (Build Windows app → Run workflow) only
#   builds: download "StykNowdz-windows" from the run's Artifacts.
# The exe files are not code-signed, so Windows SmartScreen warns on first run.
# (desktop-release.yml is StykAnimate's own signed release workflow; StykNowdz
# doesn't have its signing keys and doesn't use it.)
name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  windows:
    name: Package StykNowdz for Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: scripts/requirements-build.txt
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r scripts/requirements-build.txt
      - name: Build the native scanner, codec and video encoder
        run: |
          npm run build:frame-scan
          npm run build:vfw
          npm run build:sidecar
          npm run verify:sidecar
          npm run build:video-encoder
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
      - name: Package Setup and Portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          npm run release:prepare
          npm run dist:win -- --x64 --publish never "--config.directories.output=release/$version"
          ls -la "release/$version"
      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: StykNowdz-windows
          path: release/*/*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          title="StykNowdz ${version}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/${version}/*.exe --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/${version}/*.exe --title "${title}" --notes-file release-notes.md --latest
          fi
